<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin — Website Desa Baron</title>

  <style>
    :root {
      --burgundy: #6B1F2A;
      --burgundy-dark: #521721;
      --cream: #F5F0E6;
      --beige: #DCC8A8;
      --green: #2E6F63;
      --white: #FFFFFF;
      --text: #2B2522;
      --muted: #766D66;
      --border: rgba(107, 31, 42, 0.12);
      --shadow: 0 8px 25px rgba(43, 37, 34, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--cream);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    /* =========================================================
       LOADING SCREEN
       ========================================================= */

    #admin-loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }

    #admin-loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(430px, calc(100% - 40px));
      padding: 42px 34px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 22px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .brand-mark {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: var(--burgundy);
      color: var(--white);

      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand-title {
      margin: 0;

      color: var(--burgundy);

      font-size: 23px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      margin: 8px 0 25px;

      color: var(--muted);

      font-size: 14px;
    }

    .loading-bar {
      width: 100%;
      height: 4px;

      overflow: hidden;

      border-radius: 999px;
      background: var(--beige);
    }

    .loading-bar::after {
      content: "";

      display: block;

      width: 40%;
      height: 100%;

      border-radius: inherit;

      background: var(--green);

      animation: loading 1.2s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(350%);
      }
    }

    /* =========================================================
       DECORATIVE BRANDING
       ========================================================= */

    body::before {
      content: "";

      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      height: 4px;

      z-index: 99998;

      background:
        linear-gradient(
          90deg,
          var(--burgundy) 0%,
          var(--burgundy) 45%,
          var(--green) 45%,
          var(--green) 75%,
          var(--beige) 75%,
          var(--beige) 100%
        );
    }

    /* =========================================================
       DECORATIVE CMS STYLING
       ========================================================= */

    /* Header CMS */
    [class*="AppHeader"] {
      background: var(--burgundy) !important;
      border-bottom: none !important;
      box-shadow: 0 3px 15px rgba(43, 37, 34, 0.12) !important;
    }

    /* Sidebar CMS */
    [class*="Sidebar"] {
      background: var(--white) !important;
      border-right: 1px solid var(--border) !important;
    }

    /* Tombol utama */
    button[class*="Button"],
    a[class*="Button"] {
      border-radius: 9px !important;
    }

    /* Area utama */
    [class*="AppMain"] {
      background: var(--cream) !important;
    }

    /* Card / panel */
    [class*="Card"] {
      border-radius: 12px !important;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {
      .loading-card {
        padding: 34px 24px;
      }

      .brand-title {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       BRANDING / LOADING
       ======================================================== -->

  <div id="admin-loading">

    <div class="loading-card">

      <div class="brand-mark">
        B
      </div>

      <h1 class="brand-title">
        WEBSITE DESA BARON
      </h1>

      <p class="brand-subtitle">
        Panel Administrasi Website Desa Baron
      </p>

      <div class="loading-bar"></div>

    </div>

  </div>


  <!-- =======================================================
       DECAP CMS
       ======================================================== -->

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>


  <!-- =======================================================
       CUSTOM ADMIN SCRIPT
       ======================================================== -->

  <script>

    /*
     * Hilangkan loading screen setelah halaman selesai dimuat.
     */

    window.addEventListener("load", function () {

      setTimeout(function () {

        const loading =
          document.getElementById("admin-loading");

        if (!loading) return;

        loading.classList.add("hidden");

        setTimeout(function () {

          loading.remove();

        }, 400);

      }, 700);

    });


    /*
     * Branding tambahan pada body setelah Decap CMS dibuat.
     */

    function tambahBranding() {

      if (
        document.querySelector(
          "[data-baron-admin-brand]"
        )
      ) {
        return;
      }

      const brand = document.createElement("div");

      brand.setAttribute(
        "data-baron-admin-brand",
        "true"
      );

      brand.innerHTML = `
        <div style="
          position: fixed;
          left: 18px;
          bottom: 15px;
          z-index: 9999;
          padding: 7px 12px;
          border-radius: 8px;
          background: #6B1F2A;
          color: #FFFFFF;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: .3px;
          box-shadow: 0 4px 12px rgba(0,0,0,.12);
          pointer-events: none;
        ">
          DESA BARON · ADMIN
        </div>
      `;

      document.body.appendChild(brand);

    }


    /*
     * Tunggu sampai elemen CMS tersedia.
     */

    const observer =
      new MutationObserver(function () {

        const cms =
          document.querySelector(
            "[class*='AppHeader'], [class*='Sidebar']"
          );

        if (cms) {

          tambahBranding();

        }

      });


    observer.observe(
      document.body,
      {
        childList: true,
        subtree: true
      }
    );

  </script>

</body>
</html>
